# Put this at .github/workflows/profile-assets.yml in the sartha555k/sartha555k repo.
# Replaces snake.yml. Once a day it renders every generated image the README embeds
# and pushes them to the `output` branch, so the README itself never changes.
#
#   dist/status.svg                              custom status card (status-card/render.mjs)
#   dist/pacman-contribution-graph-dark.svg      Pac-Man eating the contribution graph
#   dist/github-contribution-grid-snake-dark.svg snake, kept for the fallback

name: profile assets

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render status card
        working-directory: status-card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund satori@^0.12 @fontsource/bebas-neue@^5 @fontsource/jetbrains-mono@^5
          node render.mjs ../dist

      - name: Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff3b1f

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
